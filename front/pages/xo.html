<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="xo.css">
</head>

<body>
    <div>
        <div class="mode" id="mode">
            <h1>Choose Mode : </h1>
            <button onclick="playerMode()" class="modeButton"> vs Player</button>
            <button onclick="AIMode()" class="modeButton"> vs AI</button>
        </div>

        <div class="difficulty" id="difficulty">
            <h1>Choose Difficulty : </h1>
            <form>
                <button onclick="setDifficulty('easy', event)" class="difficultyButton">Easy</button>
                <button onclick="setDifficulty('medium', event)" class="difficultyButton">Medium</button>
                <button onclick="setDifficulty('hard', event)" class="difficultyButton">Hard</button>

            </form>
            
        </div>        

        <div class="popup" id="popup">
            <p id="popup-text">This ishuiiiiiiiiiiiiiiiiiiiiiii a customizable pop-up message!</p>
            <button onclick="closePopup()">OK</button>
        </div>
        
        
        <div class="game" id="game">

            <h1>Tic-Tac-Toe</h1>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <script src="xo.js"></script>
    </div>
</body>
</html>
